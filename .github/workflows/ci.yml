name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Void glibc (fmt, clippy, test)
    runs-on: ubuntu-latest
    container: ghcr.io/void-linux/void-glibc-full:latest

    steps:
      - name: Install toolchain and dependencies
        shell: sh
        run: |
          xbps-install -Suy xbps && xbps-install -uy && xbps-install -y rust cargo git bash zstd && git config --global --add safe.directory '*'

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: void-glibc-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            void-glibc-${{ runner.os }}-

      - name: Format check, clippy, and tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
