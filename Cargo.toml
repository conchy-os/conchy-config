[package]
name = "conchy-config"
version = "0.1.0"
edition = "2021"
authors = ["Conchy OS Team"]
description = "Unified reactive KDL configuration daemon, library, and CLI for Conchy OS"
license = "GPL-3.0-or-later"
repository = "https://github.com/conchy-os/conchy-config"

[lib]
name = "conchy_config"
path = "src/lib.rs"

[[bin]]
name = "conchy-config"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.43", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
    "fs",
    "signal",
    "io-util"
] }
zbus = "5"
futures-util = "0.3"
kdl = "4.6"
notify = "6.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
opt-level = 3
